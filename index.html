
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>現代米語 English Viewer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #202124;
      font-family: system-ui, sans-serif;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 16px 12px 40px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
    }

    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }

    .subtitle {
      color: #5f6368;
      font-size: .9rem;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #dadce0;
      border-radius: 12px;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }

    #analyzeButton {
      color: white;
      background: #1a73e8;
    }

    #speakButton {
      color: #1a73e8;
      background: #e8f0fe;
    }

    #status {
      background: #f1f3f4;
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #analysisResult { display: none; }

    .section {
      padding: 14px 0;
      border-bottom: 1px solid #e4e6e9;
    }

    .section:last-child { border-bottom: none; }

    .label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .value {
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .item {
      margin: 8px 0;
      padding: 11px;
      background: #f8f9fa;
      border-radius: 10px;
    }

    .field {
      margin: 4px 0;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="card">
      <h1>現代米語 English Viewer</h1>

      <div class="subtitle">
        意味・文法・構造・語彙・IPA・米語の読み上げ
      </div>

      <textarea id="englishText"
        aria-label="英文を入力">I didn't see that coming.</textarea>

      <button id="analyzeButton" onclick="analyzeEnglish()">
        📘 英文を解析
      </button>

      <button id="speakButton" onclick="speakEnglish()">
        🔊 米語で聞く
      </button>

      <div id="status">英文を入力してください。</div>
    </section>

    <section id="analysisResult" class="card">
      <h2>英文のしくみ</h2>
      <div id="analysisContent"></div>
    </section>

  </main>

<script>
  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbwwwNsySQEF2s4LW8ow5QEEsDXC2tJXNLk8jEDWaVS1JC9pYqYdzF29QjuxdXeJFRmkjQ/exec';

  const englishText = document.getElementById('englishText');
  const analyzeButton = document.getElementById('analyzeButton');
  const analysisResult = document.getElementById('analysisResult');
  const analysisContent = document.getElementById('analysisContent');

  englishText.addEventListener('input', function () {
    analysisResult.style.display = 'none';
    setStatus('英文を変更しました。解析を押してください。');
  });

  async function analyzeEnglish() {
    const text = englishText.value.trim();

    if (!text) {
      setStatus('英文を入力してください。');
      return;
    }

    analyzeButton.disabled = true;
    analysisResult.style.display = 'none';
    setStatus('英文を解析しています…');

    try {
      const data = await getJsonp('analyzeEnglish', { text });

      if (!data || data.success === false || data.error) {
        throw new Error(
          data && data.error
            ? data.error
            : '解析結果を取得できませんでした。'
        );
      }

      renderAnalysis(data);
      setStatus('解析完了。');

    } catch (error) {
      setStatus('解析エラー：' + error.message);

    } finally {
      analyzeButton.disabled = false;
    }
  }

  function renderAnalysis(data) {
    analysisContent.replaceChildren();

    const entries = Object.entries(data).filter(
      ([key]) => key !== 'success'
    );

    entries.forEach(([key, value]) => {
      if (value === null || value === undefined || value === '') {
        return;
      }

      const section = document.createElement('div');
      section.className = 'section';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = getJapaneseLabel(key);

      const body = document.createElement('div');
      body.className = 'value';
      renderValue(body, value);

      section.append(label, body);
      analysisContent.appendChild(section);
    });

    if (!analysisContent.children.length) {
      analysisContent.textContent = '解析内容がありません。';
    }

    analysisResult.style.display = 'block';
  }

  function renderValue(parent, value) {
    if (value === null || value === undefined) {
      return;
    }

    if (Array.isArray(value)) {
      if (value.length === 0) {
        parent.textContent = '該当なし';
        return;
      }

      value.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        renderValue(div, item);
        parent.appendChild(div);
      });

      return;
    }

    if (typeof value === 'object') {
      Object.entries(value).forEach(([key, child]) => {
        if (child === null || child === undefined || child === '') {
          return;
        }

        const div = document.createElement('div');
        div.className = 'field';

        const strong = document.createElement('strong');
        strong.textContent = getJapaneseLabel(key) + '：';

        div.appendChild(strong);
        renderValue(div, child);
        parent.appendChild(div);
      });

      return;
    }

    parent.appendChild(
      document.createTextNode(String(value))
    );
  }

  function getJapaneseLabel(key) {
    const labels = {
      natural_translation_ja: '自然な日本語訳',
      translation_ja: '自然な日本語訳',
      sentence_pattern: '文型',
      svocm: 'S / V / O / C / M',
      sentence_structure: '文の構造',
      structure: '文の構造',
      grammar_explanation_ja: '文法解説',
      grammar: '文法',
      words: '単語・語彙',
      vocabulary: '単語・語彙',
      phrases: '句・イディオム',
      idioms: '句・イディオム',
      modern_american_usage: '現代アメリカ英語',
      modern_usage: '現代米語の使い方',
      british_note: '英国英語との差',
      advanced_note: '上級解説',
      word: '単語',
      meaning_ja: '意味',
      meaning: '意味',
      part_of_speech: '品詞',
      pos: '品詞',
      role: '文中での役割',
      ipa: '米語IPA',
      syllables: 'シラブル',
      stress: '強勢',
      phrase: '表現',
      explanation: '解説',
      example: '例文',
      source: '出典',
      S: '主語 S',
      V: '動詞 V',
      O: '目的語 O',
      C: '補語 C',
      M: '修飾語 M'
    };

    return labels[key] || key.replace(/_/g, ' ');
  }

  function speakEnglish() {
    const text = englishText.value.trim();

    if (!text) {
      setStatus('英文を入力してください。');
      return;
    }

    if (!('speechSynthesis' in window)) {
      setStatus('このブラウザでは音声再生を利用できません。');
      return;
    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 1.0;

    const voices = speechSynthesis.getVoices();

    const americanVoice = voices.find(
      voice => voice.lang.toLowerCase() === 'en-us'
    );

    if (americanVoice) {
      utterance.voice = americanVoice;
    }

    utterance.onerror = () => {
      setStatus('音声を再生できませんでした。');
    };

    speechSynthesis.speak(utterance);
  }

  function getJsonp(action, params = {}) {
    return new Promise((resolve, reject) => {
      const callbackName =
        'englishViewerCallback_' +
        Date.now() + '_' +
        Math.floor(Math.random() * 100000);

      const script = document.createElement('script');
      let finished = false;

      const timer = setTimeout(() => {
        finish(new Error('接続がタイムアウトしました。'));
      }, 60000);

      function finish(error, data) {
        if (finished) return;
        finished = true;

        clearTimeout(timer);
        script.remove();

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        if (error) {
          reject(error);
        } else {
          resolve(data);
        }
      }

      window[callbackName] = data => finish(null, data);

      script.onerror = () => {
        finish(new Error('Apps Scriptに接続できませんでした。'));
      };

      const query = new URLSearchParams({
        action,
        callback: callbackName,
        ...params
      });

      script.src = APPS_SCRIPT_URL + '?' + query.toString();
      document.body.appendChild(script);
    });
  }

  function setStatus(message) {
    document.getElementById('status').textContent = message;
  }
</script>
</body>
</html>
