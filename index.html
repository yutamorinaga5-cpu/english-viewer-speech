<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>English Pronunciation</title>

  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>

  <style>
    body {
      margin: 0;
      background: #f5f6f8;
      color: #202124;
      font-family: system-ui, sans-serif;
    }

    .app {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.35rem;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      box-sizing: border-box;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 10px;
    }

    #speakButton {
      background: #e8f0fe;
      color: #1a73e8;
    }

    #recordButton {
      background: #c5221f;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
    }

    #status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f1f3f4;
      white-space: pre-wrap;
    }

    #result {
      display: none;
      margin-top: 14px;
    }

    .score {
      font-size: 2.2rem;
      font-weight: 850;
      margin-bottom: 8px;
    }

    .history {
      color: #5f6368;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .problem {
      padding: 12px 0;
      border-top: 1px solid #dadce0;
    }

    .problem:first-child {
      border-top: 0;
    }

    .word {
      font-weight: 800;
    }

    .ipa {
      margin-top: 4px;
      color: #b06000;
      font-weight: 700;
    }

    .small {
      color: #5f6368;
      font-size: 0.9rem;
      margin-top: 4px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="card">

    <h1>米語 発音チェック</h1>

    <textarea id="englishText">I didn't see that coming.</textarea>

    <button
      id="speakButton"
      onclick="speakEnglish()"
    >
      🔊 米語で聞く
    </button>

    <button
      id="recordButton"
      onclick="assessPronunciation()"
    >
      🎤 発音する
    </button>

    <div id="status">
      発音するを押してください。
    </div>

  </div>


  <div
    id="result"
    class="card"
  >

    <div id="score" class="score"></div>

    <div id="history" class="history"></div>

    <div id="problems"></div>

  </div>

</div>


<script>

  /*
   * ↓↓↓ ここだけ変更 ↓↓↓
   *
   * Apps Script のウェブアプリURLを貼る
   */
  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbwwwNsySQEF2s4LW8ow5QEEsDXC2tJXNLk8jEDWaVS1JC9pYqYdzF29QjuxdXeJFRmkjQ/exec';


  let attemptScores = [];


  function speakEnglish() {

    const text =
      document
        .getElementById('englishText')
        .value
        .trim();

    if (!text) {
      return;
    }

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = 'en-US';
    utterance.rate = 1.0;

    speechSynthesis.speak(utterance);
  }


  async function assessPronunciation() {

    const text =
      document
        .getElementById('englishText')
        .value
        .trim();

    if (!text) {
      return;
    }


    const button =
      document.getElementById('recordButton');

    button.disabled = true;


    setStatus(
      'Azure Speechに接続しています…'
    );


    try {

      const auth =
        await getSpeechToken();


      if (
        typeof SpeechSDK === 'undefined'
      ) {

        throw new Error(
          'Azure Speech SDKを読み込めませんでした。'
        );
      }


      const speechConfig =
        SpeechSDK.SpeechConfig
          .fromAuthorizationToken(
            auth.token,
            auth.region
          );


      speechConfig.speechRecognitionLanguage =
        'en-US';


      const audioConfig =
        SpeechSDK.AudioConfig
          .fromDefaultMicrophoneInput();


      const recognizer =
        new SpeechSDK.SpeechRecognizer(
          speechConfig,
          audioConfig
        );


      const paJson =
        JSON.stringify({

          referenceText: text,

          gradingSystem:
            'HundredMark',

          granularity:
            'Phoneme',

          phonemeAlphabet:
            'IPA',

          nBestPhonemeCount:
            5,

          enableMiscue:
            true
        });


      const paConfig =
        SpeechSDK
          .PronunciationAssessmentConfig
          .fromJSON(paJson);


      paConfig.applyTo(
        recognizer
      );


      setStatus(
        '🎤 発音してください。読み終わったら少し待ってください。'
      );


      recognizer.recognizeOnceAsync(

        function(result) {

          button.disabled = false;

          recognizer.close();


          if (
            result.reason !==
            SpeechSDK.ResultReason.RecognizedSpeech
          ) {

            setStatus(
              '音声を認識できませんでした。もう一度試してください。'
            );

            return;
          }


          const assessment =
            SpeechSDK
              .PronunciationAssessmentResult
              .fromResult(result);


          const score =
            Math.round(
              assessment.pronunciationScore || 0
            );


          const rawJson =
            result.properties.getProperty(
              SpeechSDK
                .PropertyId
                .SpeechServiceResponse_JsonResult
            );


          let detail = {};

          try {
            detail =
              JSON.parse(rawJson);
          } catch (e) {
            detail = {};
          }


          attemptScores.push(score);


          renderResult(
            score,
            detail
          );


          setStatus(
            '採点完了。もう一度発音すると再採点します。'
          );
        },


        function(error) {

          button.disabled = false;

          recognizer.close();

          setStatus(
            'エラー：' +
            String(error)
          );
        }
      );


    } catch (error) {

      button.disabled = false;

      setStatus(
        'エラー：' +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )
      );
    }
  }


  function getSpeechToken() {

    return new Promise(
      function(resolve, reject) {

        if (
          !APPS_SCRIPT_URL ||
          APPS_SCRIPT_URL.includes(
            'PASTE_APPS_SCRIPT'
          )
        ) {

          reject(
            new Error(
              'Apps Script URLが未設定です。'
            )
          );

          return;
        }


        const callbackName =
          'speechTokenCallback_' +
          Date.now();


        const script =
          document.createElement(
            'script'
          );


        const timeout =
          setTimeout(
            function() {

              cleanup();

              reject(
                new Error(
                  'Speechトークン取得がタイムアウトしました。'
                )
              );

            },
            15000
          );


        window[callbackName] =
          function(data) {

            clearTimeout(timeout);

            cleanup();

            if (
              !data ||
              !data.token ||
              !data.region
            ) {

              reject(
                new Error(
                  'Speechトークンを取得できませんでした。'
                )
              );

              return;
            }


            resolve(data);
          };


        function cleanup() {

          if (
            script.parentNode
          ) {
            script.parentNode
              .removeChild(script);
          }

          try {
            delete window[
              callbackName
            ];
          } catch (e) {}
        }


        script.onerror =
          function() {

            clearTimeout(timeout);

            cleanup();

            reject(
              new Error(
                'Apps Scriptに接続できませんでした。'
              )
            );
          };


        script.src =
          APPS_SCRIPT_URL +
          '?action=speechToken' +
          '&callback=' +
          encodeURIComponent(
            callbackName
          );


        document.body.appendChild(
          script
        );
      }
    );
  }


  function renderResult(
    score,
    detail
  ) {

    document
      .getElementById('result')
      .style.display =
      'block';


    document
      .getElementById('score')
      .textContent =
      score + '点';


    const historyText =
      attemptScores
        .map(
          function(value, index) {

            if (index === 0) {

              return (
                '1回目 ' +
                value +
                '点'
              );
            }


            const diff =
              value -
              attemptScores[
                index - 1
              ];


            let arrow = '';

            if (diff > 0) {
              arrow =
                ' ↑' + diff;
            }

            if (diff < 0) {
              arrow =
                ' ↓' +
                Math.abs(diff);
            }


            return (
              (index + 1) +
              '回目 ' +
              value +
              '点' +
              arrow
            );
          }
        )
        .join('　');


    document
      .getElementById('history')
      .textContent =
      historyText;


    renderPhonemeProblems(
      detail
    );
  }


  function renderPhonemeProblems(
    data
  ) {

    const root =
      document.getElementById(
        'problems'
      );


    root.innerHTML = '';


    const candidates = [];


    try {

      const words =
        data
          .NBest[0]
          .Words || [];


      words.forEach(
        function(wordData) {

          const phonemes =
            wordData.Phonemes || [];


          phonemes.forEach(
            function(phoneme) {

              const pa =
                phoneme
                  .PronunciationAssessment
                || {};


              const accuracy =
                Number(
                  pa.AccuracyScore
                );


              if (
                !Number.isFinite(
                  accuracy
                )
              ) {
                return;
              }


              const target =
                phoneme.Phoneme || '';


              const nbest =
                phoneme
                  .NBestPhonemes
                || [];


              let heard = '';


              if (
                nbest.length > 0 &&
                nbest[0].Phoneme
              ) {

                heard =
                  nbest[0].Phoneme;
              }


              candidates.push({

                word:
                  wordData.Word || '',

                target:
                  target,

                heard:
                  heard,

                accuracy:
                  accuracy
              });
            }
          );
        }
      );

    } catch (error) {}


    candidates.sort(
      function(a, b) {

        return (
          a.accuracy -
          b.accuracy
        );
      }
    );


    const problems =
      candidates
        .filter(
          function(item) {

            return (
              item.accuracy < 80
            );
          }
        )
        .slice(0, 3);


    if (
      problems.length === 0
    ) {

      root.textContent =
        '大きな音素レベルの問題は検出されませんでした。';

      return;
    }


    const title =
      document.createElement(
        'h3'
      );

    title.textContent =
      '特に確認したい発音';

    root.appendChild(title);


    problems.forEach(
      function(item) {

        const div =
          document.createElement(
            'div'
          );

        div.className =
          'problem';


        const word =
          document.createElement(
            'div'
          );

        word.className =
          'word';

        word.textContent =
          item.word;


        div.appendChild(word);


        const ipa =
          document.createElement(
            'div'
          );

        ipa.className =
          'ipa';


        if (
          item.heard &&
          item.heard !==
          item.target
        ) {

          ipa.textContent =
            '目標 /' +
            item.target +
            '/ → 今回は /' +
            item.heard +
            '/ に近い';

        } else {

          ipa.textContent =
            '目標 /' +
            item.target +
            '/';
        }


        div.appendChild(ipa);


        const detail =
          document.createElement(
            'div'
          );

        detail.className =
          'small';

        detail.textContent =
          'この音素の精度：' +
          Math.round(
            item.accuracy
          );


        div.appendChild(detail);


        root.appendChild(div);
      }
    );
  }


  function setStatus(text) {

    document
      .getElementById(
        'status'
      )
      .textContent =
      text;
  }

</script>

</body>
</html>
