<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>English Pronunciation</title>

  <style>
    body {
      margin: 0;
      background: #f5f6f8;
      color: #202124;
      font-family: system-ui, sans-serif;
    }

    .app {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.35rem;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 95px;
      box-sizing: border-box;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    #recordButton {
      color: white;
      background: #c5221f;
    }

    #stopButton {
      color: white;
      background: #5f6368;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f1f3f4;
      white-space: pre-wrap;
    }

    #result {
      margin-top: 12px;
      display: none;
      padding: 12px;
      border-radius: 10px;
      background: #e6f4ea;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="card">

    <h1>発音録音テスト</h1>

    <div>
      練習する英文
    </div>

    <textarea id="englishText">I didn't see that coming.</textarea>

    <button
      id="recordButton"
      onclick="startRecording()"
    >
      🎤 録音開始
    </button>

    <button
      id="stopButton"
      onclick="stopRecording()"
      disabled
    >
      ■ 録音終了
    </button>

    <div id="status">
      録音開始を押してください。
    </div>

    <div id="result"></div>

  </div>

</div>


<script>

  let audioContext = null;
  let mediaStream = null;
  let sourceNode = null;
  let processorNode = null;

  let recordedChunks = [];
  let inputSampleRate = 48000;


  async function startRecording() {

    const recordButton =
      document.getElementById('recordButton');

    const stopButton =
      document.getElementById('stopButton');

    const status =
      document.getElementById('status');

    const result =
      document.getElementById('result');


    result.style.display = 'none';
    result.textContent = '';

    recordedChunks = [];


    try {

      status.textContent =
        'マイクを準備しています…';


      mediaStream =
        await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });


      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      inputSampleRate =
        audioContext.sampleRate;


      sourceNode =
        audioContext.createMediaStreamSource(
          mediaStream
        );


      processorNode =
        audioContext.createScriptProcessor(
          4096,
          1,
          1
        );


      processorNode.onaudioprocess =
        function(event) {

          const input =
            event.inputBuffer
              .getChannelData(0);

          recordedChunks.push(
            new Float32Array(input)
          );
        };


      sourceNode.connect(
        processorNode
      );


      processorNode.connect(
        audioContext.destination
      );


      recordButton.disabled = true;
      stopButton.disabled = false;


      status.textContent =
        '🎤 録音中です。\n英文を普通の速度で読んでください。';


    } catch (error) {

      status.textContent =
        '❌ マイクを開始できませんでした。\n' +
        error.name +
        ': ' +
        error.message;
    }
  }


  async function stopRecording() {

    const recordButton =
      document.getElementById('recordButton');

    const stopButton =
      document.getElementById('stopButton');

    const status =
      document.getElementById('status');

    const result =
      document.getElementById('result');


    stopButton.disabled = true;


    if (processorNode) {

      processorNode.disconnect();
      processorNode = null;
    }


    if (sourceNode) {

      sourceNode.disconnect();
      sourceNode = null;
    }


    if (mediaStream) {

      mediaStream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

      mediaStream = null;
    }


    if (audioContext) {

      await audioContext.close();
      audioContext = null;
    }


    status.textContent =
      '録音データを変換しています…';


    const merged =
      mergeBuffers(
        recordedChunks
      );


    const resampled =
      resampleTo16k(
        merged,
        inputSampleRate
      );


    const wavBlob =
      encodeWav16k(
        resampled
      );


    recordButton.disabled = false;


    const seconds =
      resampled.length / 16000;


    result.style.display =
      'block';

    result.textContent =
      '✅ 録音成功\n' +
      '録音時間：約 ' +
      seconds.toFixed(1) +
      ' 秒\n' +
      '16kHz WAVへの変換も成功しました。';


    status.textContent =
      '録音テスト完了';
  }


  function mergeBuffers(chunks) {

    let totalLength = 0;


    chunks.forEach(function(chunk) {
      totalLength += chunk.length;
    });


    const result =
      new Float32Array(
        totalLength
      );


    let offset = 0;


    chunks.forEach(function(chunk) {

      result.set(
        chunk,
        offset
      );

      offset += chunk.length;
    });


    return result;
  }


  function resampleTo16k(
    input,
    originalRate
  ) {

    const targetRate =
      16000;


    if (
      originalRate === targetRate
    ) {
      return input;
    }


    const ratio =
      originalRate /
      targetRate;


    const newLength =
      Math.round(
        input.length /
        ratio
      );


    const output =
      new Float32Array(
        newLength
      );


    for (
      let i = 0;
      i < newLength;
      i++
    ) {

      const position =
        i * ratio;

      const index =
        Math.floor(position);

      const fraction =
        position - index;


      const sample1 =
        input[index] || 0;


      const sample2 =
        input[
          Math.min(
            index + 1,
            input.length - 1
          )
        ] || 0;


      output[i] =
        sample1 +
        (
          sample2 -
          sample1
        ) *
        fraction;
    }


    return output;
  }


  function encodeWav16k(samples) {

    const buffer =
      new ArrayBuffer(
        44 +
        samples.length * 2
      );


    const view =
      new DataView(buffer);


    writeString(
      view,
      0,
      'RIFF'
    );


    view.setUint32(
      4,
      36 +
      samples.length * 2,
      true
    );


    writeString(
      view,
      8,
      'WAVE'
    );


    writeString(
      view,
      12,
      'fmt '
    );


    view.setUint32(
      16,
      16,
      true
    );


    view.setUint16(
      20,
      1,
      true
    );


    view.setUint16(
      22,
      1,
      true
    );


    view.setUint32(
      24,
      16000,
      true
    );


    view.setUint32(
      28,
      16000 * 2,
      true
    );


    view.setUint16(
      32,
      2,
      true
    );


    view.setUint16(
      34,
      16,
      true
    );


    writeString(
      view,
      36,
      'data'
    );


    view.setUint32(
      40,
      samples.length * 2,
      true
    );


    let offset =
      44;


    for (
      let i = 0;
      i < samples.length;
      i++
    ) {

      let sample =
        Math.max(
          -1,
          Math.min(
            1,
            samples[i]
          )
        );


      sample =
        sample < 0
          ? sample * 0x8000
          : sample * 0x7FFF;


      view.setInt16(
        offset,
        sample,
        true
      );


      offset += 2;
    }


    return new Blob(
      [view],
      {
        type:
          'audio/wav'
      }
    );
  }


  function writeString(
    view,
    offset,
    text
  ) {

    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      view.setUint8(
        offset + i,
        text.charCodeAt(i)
      );
    }
  }

</script>

</body>
</html>
