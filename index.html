<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>English Viewer Mic Test</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      min-height: 56px;
      font-size: 18px;
      font-weight: bold;
      border: 0;
      border-radius: 12px;
      color: white;
      background: #c5221f;
    }

    #status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #f1f3f4;
    }
  </style>
</head>

<body>

  <h1>マイク動作確認</h1>

  <p>
    このページでマイクが使えるか確認します。
  </p>

  <button onclick="checkMicrophone()">
    🎤 マイクを確認
  </button>

  <div id="status">
    まだ確認していません。
  </div>


  <script>
    async function checkMicrophone() {

      const status =
        document.getElementById('status');

      status.textContent =
        'マイクへの接続を確認しています…';

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        status.textContent =
          '✅ マイクを利用できます。';

        stream
          .getTracks()
          .forEach(function(track) {
            track.stop();
          });

      } catch (error) {

        status.textContent =
          '❌ マイクを利用できません。\n' +
          error.name +
          ': ' +
          error.message;
      }
    }
  </script>

</body>
</html>
